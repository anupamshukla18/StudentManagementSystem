<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Student Management System</h1>
        
        <!-- Add/Edit Student Form -->
        <div class="form-section">
            <h2 id="form-title">Add New Student</h2>
            <form id="student-form">
                <input type="hidden" id="student-id">
                
                <div class="form-group">
                    <label>Name:</label>
                    <input type="text" id="name" required>
                </div>
                
                <div class="form-group">
                    <label>Email:</label>
                    <input type="email" id="email" required>
                </div>
                
                <div class="form-group">
                    <label>Phone:</label>
                    <input type="tel" id="phone" required>
                </div>
                
                <div class="form-group">
                    <label>Course:</label>
                    <input type="text" id="course" required>
                </div>
                
                <div class="form-group">
                    <label>Enrollment Date:</label>
                    <input type="date" id="enrollment-date" required>
                </div>
                
                <div class="button-group">
                    <button type="submit" id="submit-btn">Add Student</button>
                    <button type="button" id="cancel-btn" style="display:none;">Cancel</button>
                </div>
            </form>
        </div>
        
        <!-- Search Section -->
        <div class="search-section">
            <input type="text" id="search-input" placeholder="Search by name...">
            <button id="search-btn">Search</button>
            <button id="show-all-btn">Show All</button>
        </div>
        
        <!-- Students Table -->
        <div class="table-section">
            <h2>Student List</h2>
            <table id="students-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Course</th>
                        <th>Enrollment Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="students-tbody">
                    <!-- Students will be loaded here -->
                </tbody>
            </table>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
